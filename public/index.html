<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
  <title>TermTV</title>
  <link rel="stylesheet" id="theme-css" href="css/theme-midnight.css">
  <!-- Samsung TV product APIs (webapis.avplay, productinfo). Absent in a desktop browser, which is fine. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body style="background:#0c131d">
  <!-- Plain HTML/ES5 on purpose: visible even if the app bundle fails to start on an old TV. -->
  <div id="splash" style="position:fixed;left:0;top:0;width:100%;height:100%;background:#0c131d;color:#3ea6ff;font-family:monospace;font-size:40px;z-index:1000">
    <div style="position:absolute;left:160px;top:420px">&gt;_ TermTV <span style="color:#7d91ab">loading...</span></div>
    <pre id="boot-steps" style="position:absolute;left:160px;top:480px;color:#7d91ab;font-size:22px"></pre>
    <pre id="boot-error" style="position:absolute;left:160px;top:620px;right:160px;color:#ff6b6b;font-size:22px;white-space:pre-wrap"></pre>
  </div>
  <script src="js/boot.js"></script>
  <div id="app"></div>
  <script src="js/app.js"></script>
</body>
</html>
