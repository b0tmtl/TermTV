# Builds and signs TermTV.wgt and attaches it to a GitHub Release, so TizenBrew Installer can install it
# with "Install from GitHub" -> b0tmtl/TermTV. Triggered by pushing a tag like v0.1.0, or run it by hand
# (Actions -> Release -> Run workflow), or push to main with [release] in the commit message: those
# tag the release v<package.json version>.
#
# Signing: a Tizen author certificate + the public Tizen distributor certificate (same approach as
# TizenBrew). TVs below Tizen 7 accept that in developer mode; on Tizen 7+ TizenBrew Installer re-signs
# the package with the user's own Samsung certificate.
#
# Secrets (keep them: updates must be signed with the same author certificate):
#   TIZEN_AUTHOR_KEY      base64 of the author .p12
#   TIZEN_AUTHOR_KEY_PW   its password
# Without them a temporary certificate is generated (fine for a first test, but later versions
# won't install over it until you uninstall).

name: Release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  release:
    # On main, only commits whose message contains [release] publish a release.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Install Tizen CLI
        run: |
          sudo apt-get install -y expect
          curl -fLo tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$GITHUB_WORKSPACE/tizen-studio"
          rm tizen-installer

      - name: Prepare certificate
        env:
          KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          KEY_PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          TIZEN="$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin/tizen"
          mkdir -p "$GITHUB_WORKSPACE/author" "$GITHUB_WORKSPACE/tizen-studio-data/profile"
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > "$GITHUB_WORKSPACE/author/termtv-author.p12"
            PW="$KEY_PW"
          else
            echo "::warning::TIZEN_AUTHOR_KEY secret not set: signing with a temporary author certificate."
            PW="termtv-temp-$(date +%s)"
            "$TIZEN" certificate -a TermTV -p "$PW" -n "TermTV" -o "TermTV" -f termtv-author
            find "$HOME" "$GITHUB_WORKSPACE" -name 'termtv-author.p12' -not -path "$GITHUB_WORKSPACE/author/*" -exec cp {} "$GITHUB_WORKSPACE/author/termtv-author.p12" \; -quit
          fi
          test -s "$GITHUB_WORKSPACE/author/termtv-author.p12"
          export PW
          # Fail early with a clear message when the key or its password is wrong.
          if ! openssl pkcs12 -in "$GITHUB_WORKSPACE/author/termtv-author.p12" -passin env:PW -noout -legacy 2>/dev/null \
             && ! openssl pkcs12 -in "$GITHUB_WORKSPACE/author/termtv-author.p12" -passin env:PW -noout 2>/dev/null; then
            echo "::error::TIZEN_AUTHOR_KEY can't be opened with TIZEN_AUTHOR_KEY_PW: the base64 text or the password is wrong."
            head -c 4 "$GITHUB_WORKSPACE/author/termtv-author.p12" | od -An -tx1
            exit 1
          fi
          PROFILES="$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"
          sed -e "s|\$WS|$GITHUB_WORKSPACE|g" -e "s|\$KEY_PW|$PW|g" .github/tizen/profiles.xml > "$PROFILES"
          "$TIZEN" cli-config "profiles.path=$PROFILES"

      - name: Package
        run: |
          mkdir -p build
          expect -c "set timeout -1; spawn $GITHUB_WORKSPACE/tizen-studio/tools/ide/bin/tizen package -t wgt -s TermTV -o build -- dist; expect eof"
          WGT=$(ls build/*.wgt 2>/dev/null | head -1)
          if [ -z "$WGT" ]; then tail -60 tizen-studio-data/cli/logs/cli.log "$GITHUB_WORKSPACE/tizen-studio-data/cli/logs/cli.log" 2>/dev/null; exit 1; fi
          [ "$WGT" = build/TermTV.wgt ] || mv "$WGT" build/TermTV.wgt
          ls -la build

      - name: Release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT";
          else echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: build/TermTV.wgt
